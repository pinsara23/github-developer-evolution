[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-developer-evolution"
version = "1.0.0"
description = "A GitHub-powered pixel-art developer progression system."
requires-python = ">=3.12"
dependencies = ["requests>=2.31,<3", "PyYAML>=6.0,<7", "python-dotenv>=1.0,<2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
